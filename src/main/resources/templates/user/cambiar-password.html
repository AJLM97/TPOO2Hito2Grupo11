<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="containcer py-4">
    <div class="page.header">
        <h2>Cambiar contraseña</h2>
    </div>

    <div class="card form-card">
        <div class="card-body">
            <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${exito != null}" class="alert alert-success" th:text="${exito}"></div>

            <form th:action="@{/usuario/cambiar-password}" method="post">
                <div class="mb-3">
                    <label for="contraseniaActual" class="form-label">Contraseña actual</label>
                    <input type="password" class="form-control" id="contraseniaActual"
                           name="contraseniaActual" autocomplete="current-password" required>
                </div>

                <div class="mb-3">
                    <label for="contraseniaNueva" class="form-label">Contraseña nueva</label>
                    <input type="password" class="form-control" id="contraseniaNueva"
                           name="contraseniaNueva" autocomplete="new-password" required>
                </div>

                <div class="mb-3">
                    <label for="repetirContraseniaNueva" class="form-label">Repetir contraseña nueva</label>
                    <input type="password" class="form-control" id="repetirContraseniaNueva"
                           name="repetirContraseniaNueva" autocomplete="new-password" required
                </div>

                <div class="d-flex">
                    <button type="submit" class="btn btn-success mr-2">Confirmar cambio</button>
                    <a th:href="@{/loginsuccess}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
