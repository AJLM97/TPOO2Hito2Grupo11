<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Epicentro Gourmet</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body class="bg-light">

<div class="login-container">
    <div class="card login-card">
        <div class="card-body">
            <div class="login-header">
                <h3>Epicentro Gourmet</h3>
                <p class="text-muted">Inicie sesión para continuar</p>
            </div>

            <div th:if="${error != null}" class="alert alert-danger">
                Usuario o contrasena invalidos.
            </div>

            <div th:if="${logout != null}" class="alert alert-success">
                Debe iniciar sesión para proceder.
            </div>

            <form th:action="@{/loginprocess}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Email</label>
                    <input type="text" class="form-control" id="username" name="email" required autofocus placeholder="Ingrese su usuario"/>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contrasena</label>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="Ingrese su contrasena"/>
                </div>
                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
