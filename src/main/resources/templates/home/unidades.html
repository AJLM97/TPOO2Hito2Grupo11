<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="page-header d-flex justify-content-between align-items-center">
        <h2 th:text="|Unidades de Venta - ${nombreFestival}|">Unidades de Venta</h2>
        <a th:href="@{/festival/{id}/registrar(id=${idFestival})}" class="btn btn-primary">Registrar mi Unidad</a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Responsable</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="unidad : ${unidades}">
                        <td th:text="${unidad.nombreComercial}"></td>
                        <td th:text="${unidad.responsable.email}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${unidades == null or unidades.isEmpty()}" class="text-center text-muted py-4">
                No hay unidades de venta registradas.
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
