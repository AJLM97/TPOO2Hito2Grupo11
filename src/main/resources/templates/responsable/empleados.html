<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="page-header d-flex justify-content-between align-items-center">
        <h2>Empleados</h2>
        <a th:href="@{/responsable/empleados/nuevo}" class="btn btn-primary">Agregar Empleado</a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Fecha Ingreso</th>
                        <th>Sueldo Base</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="empleado : ${empleados}">
                        <td th:text="${empleado.id}"></td>
                        <td th:text="${empleado.apellido}, ${empleado.nombre}"></td>
                        <td th:text="${empleado.responsable.fecha_ingreso}"></td>
                        <td th:text="${empleado.sueldo_base}"></td>
                        <td class="action-buttons"/>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${empleados == null or empleados.isEmpty()}" class="text-center text-muted py-4">
                No hay empleados registrados.
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
