<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="page-header d-flex justify-content-between align-items-center">
        <h2>Empleados</h2>
        <a th:href="@{/responsable/empleados/nuevo}" class="btn btn-primary">Agregar Empleado</a>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <form th:action="@{/responsable/empleados}" th:object="${filtro}" method="get" class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" id="nombre" th:field="*{nombre}" class="form-control">
                </div>
                <div class="col-md-3">
                    <label for="apellido" class="form-label">Apellido</label>
                    <input type="text" id="apellido" th:field="*{apellido}" class="form-control">
                </div>
                <div class="col-md-2">
                    <label for="dni" class="form-label">DNI</label>
                    <input type="number" id="dni" th:field="*{dni}" class="form-control">
                </div>
                <div class="col-md-2">
                    <label for="tipoEmpleado" class="form-label">Tipo</label>
                    <select id="tipoEmpleado" th:field="*{tipoEmpleado}" class="form-select">
                        <option value="">Todos</option>
                        <option value="CAJERO">Cajero</option>
                        <option value="COCINERO">Cocinero</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="categoriaCocinero" class="form-label">Categoría</label>
                    <select id="categoriaCocinero" th:field="*{categoriaCocinero}" class="form-select">
                        <option value="">Todas</option>
                        <option value="COCINERO">Cocinero</option>
                        <option value="COCINERO_AYUDANTE">Cocinero ayudante</option>
                        <option value="LAVAPLATOS">Lavaplatos</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="turnoTrabajo" class="form-label">Turno</label>
                    <select id="turnoTrabajo" th:field="*{turnoTrabajo}" class="form-select">
                        <option value="">Todos</option>
                        <option value="MANANA">Mañana</option>
                        <option value="TARDE">Tarde</option>
                        <option value="NOCHE">Noche</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="ingresoDesde" class="form-label">Ingreso desde</label>
                    <input type="date" id="ingresoDesde" th:field="*{ingresoDesde}" class="form-control">
                </div>
                <div class="col-md-3">
                    <label for="ingresoHasta" class="form-label">Ingreso hasta</label>
                    <input type="date" id="ingresoHasta" th:field="*{ingresoHasta}" class="form-control">
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Filtrar</button>
                    <a th:href="@{/responsable/empleados}" class="btn btn-outline-secondary">Limpiar</a>
                </div>
                <div class="col-12 text-danger" th:if="${#fields.hasErrors('rangoFechasValido')}"
                     th:errors="*{rangoFechasValido}"></div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>DNI</th>
                        <th>Fecha Ingreso</th>
                        <th>Puesto</th>
                        <th>Sueldo Base</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="empleado : ${empleados}">
                        <td th:text="${empleado.id}"></td>
                        <td th:text="${empleado.apellido + ', ' + empleado.nombre}"></td>
                        <td th:text="${empleado.dni}"></td>
                        <td th:text="${empleado.fechaIngreso}"></td>
                        <td>
                            <div
                                th:classappend="${empleado instanceof T(edu.unla.epicentro_gourmet.entities.Cocinero)} ? 'puesto-cocinero' : 'puesto-cajero'"
                                th:text="${empleado instanceof T(edu.unla.epicentro_gourmet.entities.Cocinero)
                                        ? #strings.capitalizeWords(#strings.toLowerCase(#strings.replace(empleado.categoria.name(), '_', ' ')))
                                        : 'Cajero'}">
                            </div>
                        </td>
                        <td th:text="${#numbers.formatDecimal(empleado.sueldoBase, 1, 2)}"></td>
                        <td class="action-buttons"/>
                            <a th:href="@{/responsable/empleados/editar/{id}(id=${empleado.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                            <form th:action="@{/responsable/empleados/baja/{id}(id=${empleado.id})}" method="post" class="d-inline" onsubmit="return confirm('¿Quieres darle de baja?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Dar de Baja</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${empleados == null or empleados.isEmpty()}" class="text-center text-muted py-4">
                No hay empleados registrados.
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
