<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="page-header d-flex justify-content-between align-items-center">
        <h2>Empleados</h2>
        <a th:href="@{/responsable/empleados/nuevo}" class="btn btn-primary">Agregar Empleado</a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>DNI</th>
                        <th>Fecha Ingreso</th>
                        <th>Puesto</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="empleado : ${empleados}">
                        <td th:text="${empleado.id}"></td>
                        <td th:text="${empleado.apellido + ', ' + empleado.nombre}"></td>
                        <td th:text="${empleado.dni}"></td>
                        <td th:text="${empleado.fechaIngreso}"></td>
                        <td>
                            <div
                                th:classappend="${empleado instanceof T(edu.unla.epicentro_gourmet.entities.Cocinero)} ? 'puesto-cocinero' : 'puesto-cajero'"
                                th:text="${empleado instanceof T(edu.unla.epicentro_gourmet.entities.Cocinero)
                                        ? #strings.capitalizeWords(#strings.toLowerCase(#strings.replace(empleado.categoria.name(), '_', ' ')))
                                        : 'Cajero'}">
                            </div>
                        </td>
                        <td class="action-buttons"/>
                            <a th:href="@{/responsable/empleados/editar/{id}(id=${empleado.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                            <form th:action="@{/responsable/empleados/baja/{id}(id=${empleado.id})}" method="post" class="d-inline" onsubmit="return confirm('¿Quieres darle de baja?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Dar de Baja</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${empleados == null or empleados.isEmpty()}" class="text-center text-muted py-4">
                No hay empleados registrados.
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
