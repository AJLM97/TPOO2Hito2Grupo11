<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="campos">
    <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
        <ul class="mb-0">
            <li th:each="error : ${#fields.errors('*')}" th:text="${error}"></li>
        </ul>
    </div>
    <div class="mb-3">
        <label for="nombre" class="col-form-label">Nombre</label>
        <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required placeholder="Ingrese el nombre del plato"/>
    </div>
    <div class="mb-3">
        <label for="precioVenta" class="col-form-label">Precio de venta</label>
        <input type="number" step="0.01" min="0.01" id="precioVenta" th:field="*{precioVenta}" class="form-control" required/>
    </div>
    <div class="mb-3">
        <label for="costoProduccion" class="col-form-label">Costo de producción</label>
        <input type="number" step="0.01" min="0" id="costoProduccion" th:field="*{costoProduccion}" class="form-control" required/>
    </div>
</th:block>
</body>
</html>
