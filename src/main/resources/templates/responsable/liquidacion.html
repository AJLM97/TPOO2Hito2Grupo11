<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="page-header">
        <h2>Liquidación de haberes</h2>
        <p class="text-muted mb-0" th:if="${festival != null}">
            Festival: <span th:text="${festival.nombre}"></span>
            (<span th:text="${festival.fechaInicio}"></span> al <span th:text="${festival.fechaFin}"></span>)
        </p>
    </div>

    <div th:if="${liquidaciones == null}" class="alert alert-warning">
        El festival de la unidad no tiene costos configurados, por lo que no se puede liquidar.
    </div>

    <div th:if="${liquidaciones != null}" class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead>
                    <tr>
                        <th>Empleado</th>
                        <th>Rol</th>
                        <th class="text-right">Sueldo base</th>
                        <th>Concepto</th>
                        <th class="text-right">Adicional</th>
                        <th class="text-right">Días</th>
                        <th class="text-right">% a cobrar</th>
                        <th class="text-right">Total</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="liquidacion : ${liquidaciones}">
                        <td th:text="${liquidacion.nombreCompleto}"></td>
                        <td th:text="${liquidacion.rol}"></td>
                        <td class="text-right" th:text="${#numbers.formatDecimal(liquidacion.sueldoBase, 1, 2)}"></td>
                        <td th:text="${liquidacion.conceptoAdicional}"></td>
                        <td class="text-right" th:text="${#numbers.formatDecimal(liquidacion.adicional, 1, 2)}"></td>
                        <td class="text-right" th:text="${liquidacion.diasFestival}"></td>
                        <td class="text-right" th:text="${#numbers.formatDecimal(liquidacion.porcentaje * 100, 1, 0) + '%'}"></td>
                        <td class="text-right" th:text="${#numbers.formatDecimal(liquidacion.total, 1, 2)}"></td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr>
                        <th colspan="7">Total del personal</th>
                        <th class="text-right" th:text="${#numbers.formatDecimal(totalPersonal, 1, 2)}"></th>
                    </tr>
                    </tfoot>
                </table>
            </div>
            <div th:if="${liquidaciones.isEmpty()}" class="text-center text-muted py-4">
                No hay empleados activos en la unidad.
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
