<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="page-header">
        <h2>Nuevo Empleado</h2>
    </div>

    <div class="card form-card">
        <div class="card-body">
            <form th:action="@{/responsable/empleados/guardar}" th:object="${empleado}" method="post">
                <input type="hidden" th:field="*{passwordResponsable}">
                <input type="hidden" th:field="*{repetirPassword}">
                <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                    <ul class="mb-0">
                        <li th:each="error : ${#fields.errors('*')}" th:text="${error}"></li>
                    </ul>
                </div>
                <div class="mb-3">
                    <label for="nombre" class="col-form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required placeholder="Ingrese el nombre"/>
                </div>
                <div class="mb-3">
                    <label for="apellido" class="col-form-label">Apellido</label>
                    <input type="text" class="form-control" id="apellido" th:field="*{apellido}" required placeholder="Ingrese el apellido"/>
                </div>
                <div class="mb-3">
                    <label for="dni" class="col-form-label">DNI</label>
                    <input type="number" id="dni" th:field="*{dni}" min="1000000" max="99999999" step="1" class="form-control" required placeholder="Ingrese el DNI"/>
                </div>
                <div class="mb-3">
                    <label for="fechaNacimiento" class="col-form-label">Fecha de nacimiento</label>
                    <input type="date" class="form-control" id="fechaNacimiento" th:field="*{fechaNacimiento}" required>
                </div>
                <div class="mb-3">
                    <label for="tipoEmpleado" class="col-form-label">Tipo de empleado</label>
                    <select th:field="*{tipoEmpleado}" id="tipoEmpleado" class="form-select">
                        <option value="CAJERO">Cajero</option>
                        <option value="COCINERO">Cocinero</option>
                    </select>
                </div>
                <div id="contenedorCajero" class="mb-3">
                    <label for="turnoCajero" class="col-form-label">Turno</label>
                    <select id="turnoCajero" th:field="*{turnoTrabajo}" class="form-select">
                        <option value="MANANA">Mañana</option>
                        <option value="TARDE">Tarde</option>
                        <option value="NOCHE">Noche</option>
                    </select>
                </div>
                <div id="contenedorCocinero" class="mb-3" style="display: none;">
                    <label for="categoriaCocinero" class="col-form-label">Categoría</label>
                    <select id="categoriaCocinero" th:field="*{categoriaCocinero}" class="form-select">
                        <option value="COCINERO">Cocinero</option>
                        <option value="COCINERO_AYUDANTE">Cocinero ayudante</option>
                        <option value="LAVAPLATOS">Lavaplatos</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="emailPersonal" class="col-form-label">Email personal <span class="text-muted small">(recibirá las crendenciales)</span></label>
                    <input type="email" id="emailPersonal" th:field="*{emailPersonal}" class="form-control" placeholder="Ingrese el email" required />
                </div>
                <div class="d-flex">
                    <button type="submit" class="btn btn-success mr-2">Crear</button>
                    <a th:href="@{/responsable/empleados}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
<script th:src="@{/js/empleados-form.js}"></script>
</body>
</html>
