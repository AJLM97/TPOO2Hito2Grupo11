<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="page-header">
        <h2>Ranking de unidades por recaudación</h2>
        <p class="text-muted">Se consideran únicamente los pedidos cerrados.</p>
    </div>

    <form class="row g-3 align-items-end mb-4" method="get" th:action="@{/admin/ranking-recaudacion}">
        <div class="col-md-8">
            <label for="festivalId" class="form-label">Festival</label>
            <select id="festivalId" name="festivalId" class="form-select" required>
                <option value="">Selecciona un festival</option>
                <option th:each="festival : ${festivales}" th:value="${festival.id}"
                        th:text="${festival.nombre}"
                        th:selected="${festivalSeleccionado != null and festival.id == festivalSeleccionado.id}"></option>
            </select>
        </div>
        <div class="col-md-4">
            <button type="submit" class="btn btn-primary">Ver ranking</button>
        </div>
    </form>

    <h3 th:if="${festivalSeleccionado != null}"
        th:text="|Festival: ${festivalSeleccionado.nombre}|"></h3>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive" th:if="${ranking != null and !ranking.isEmpty()}">
                <table class="table table-striped table-hover mb-0">
                    <thead>
                    <tr>
                        <th>Puesto</th>
                        <th>Unidad de venta</th>
                        <th>Código</th>
                        <th class="text-end">Recaudación</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="unidad, estado : ${ranking}">
                        <td th:text="${estado.count}"></td>
                        <td th:text="${unidad.nombreUnidad}"></td>
                        <td th:text="${unidad.codigoUnidad}"></td>
                        <td class="text-end"
                            th:text="${#numbers.formatDecimal(unidad.recaudacion, 1, 'POINT', 2, 'COMMA')}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${ranking != null and ranking.isEmpty()}" class="text-center text-muted py-4">
                No hay unidades de venta registradas.
            </div>
            <div th:if="${ranking == null}" class="text-center text-muted py-4">
                Selecciona un festival para consultar su ranking.
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
