<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="page-header">
        <h2>Nueva Unidad de Venta</h2>
    </div>

    <div class="card form-card">
        <div class="card-body">
            <form th:action="@{/admin/festivales/{id}/unidades/guardar(id=${idFestival})}" th:object="${unidad}" method="post">
                <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                    <ul class="mb-0">
                        <li th:each="error : ${#fields.errors('*')}" th:text="${error}"></li>
                    </ul>
                </div>
                <div class="mb-3">
                    <label for="nombreComercial" class="col-form-label">Nombre comercial</label>
                    <input type="text" class="form-control" id="nombreComercial" th:field="*{nombreComercial}" required placeholder="Ingrese el nombre comercial"/>
                </div>
                <div class="mb-3">
                    <label for="superficie" class="col-form-label">Superficie</label>
                    <input type="number" class="form-control" id="superficie" th:field="*{superficie}" required placeholder="Ingrese la superficie"/>
                </div>
                <div class="mb-3">
                    <label for="emailResponsable" class="col-form-label">Email del responsable</label>
                    <input type="email" class="form-control" id="emailResponsable" th:field="*{emailResponsable}" required placeholder="Ingrese el email del responsable"/>
                </div>
                <div class="mb-3">
                    <label for="codigo" class="col-form-label">Código</label>
                    <input type="text" class="form-control" id="codigo" th:field="*{codigo}" required placeholder="Ingrese el código"/>
                </div>
                <div class="mb-3">
                    <label for="tipoUnidadVenta" class="col-form-label">Tipo de unidad de venta</label>
                    <select th:field="*{tipoUnidadVenta}" id="tipoUnidadVenta" class="form-select">
                        <option value="PUESTO_DESARMABLE">Puesto Desarmable</option>
                        <option value="FOOD_TRUCK">Food Truck</option>
                    </select>
                </div>
                <div id="contenedorPatente" class="mb-3" style="display: none;">
                    <label for="patente" class="col-form-label">Patente</label>
                    <input type="text" class="form-control" id="patente" th:field="*{patente}" placeholder="Ingrese la patente"/>
                </div>
                <div id="contenedorConexionElectrica" class="mb-3" style="display: none;">
                    <input type="checkbox" class="form-check-input" id="conexionElectrica" th:field="*{conexionElectrica}">
                    <label for="conexionElectrica" class="col-form-label">Conexión eléctrica</label>
                </div>
                <div id="contenedorCantidadDeCarpas" class="mb-3">
                    <label for="cantidadDeCarpas" class="col-form-label">Cantidad de carpas</label>
                    <input type="number" class="form-control" id="cantidadDeCarpas" th:field="*{cantidadDeCarpas}" placeholder="Ingrese la cantidad de carpas"/>
                </div>
                <div id="contenedorTiempoMontajeMinutos" class="mb-3">
                    <label for="tiempoMontajeMinutos" class="col-form-label">Tiempo de montaje (minutos)</label>
                    <input type="number" class="form-control" id="tiempoMontajeMinutos" th:field="*{tiempoMontajeMinutos}" placeholder="Ingrese el tiempo de montaje en minutos"/>
                </div>
                <div class="d-flex">
                    <button type="submit" class="btn btn-success mr-2">Crear</button>
                    <a th:href="@{/admin/festivales/{id}/unidades(id=${idFestival})}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
<script th:src="@{/js/unidades-form.js}"></script>
</body>
</html>
