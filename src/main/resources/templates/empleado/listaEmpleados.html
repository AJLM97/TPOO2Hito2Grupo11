<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Filtrar Empleados Activos - Epicentro Gourmet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h2>Consultar Empleados Activos</h2>

<!-- Formulario de Filtros -->
<form th:action="@{/empleados/filtrar}" th:object="${filtro}" method="get" class="card card-body mb-4 bg-light">
    <div class="row g-3">
        <div class="col-md-3">
            <label class="form-label">Nombre:</label>
            <input type="text" th:field="*{nombre}" class="form-control" placeholder="Buscar por nombre..."/>
        </div>
        <div class="col-md-3">
            <label class="form-label">Apellido:</label>
            <input type="text" th:field="*{apellido}" class="form-control" placeholder="Buscar por apellido..."/>
        </div>
        <div class="col-md-3">
            <label class="form-label">DNI:</label>
            <input type="number" th:field="*{dni}" class="form-control" placeholder="DNI exacto..."/>
        </div>
        <div class="col-md-3">
            <label class="form-label">Rol / Tipo:</label>
            <select th:field="*{tipoEmpleado}" class="form-select">
                <option value="">-- Todos --</option>
                <option value="CAJERO">Cajero</option>
                <option value="COCINERO">Cocinero</option>
            </select>
        </div>
    </div>
    <div class="mt-3">
        <button type="submit" class="btn btn-primary">Buscar / Filtrar</button>
        <a th:href="@{/empleados/filtrar}" class="btn btn-secondary">Limpiar Filtros</a>
    </div>
</form>

<!-- Tabla de Resultados -->
<table class="table table-striped table-hover">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>DNI</th>
        <th>Fecha Ingreso</th>
        <th>Tipo</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="emp : ${empleados}">
        <td th:text="${emp.idEmpleado}">1</td>
        <td th:text="${emp.nombre}">Juan</td>
        <td th:text="${emp.apellido}">Pérez</td>
        <td th:text="${emp.dni}">12345678</td>
        <td th:text="${emp.fechaIngreso}">2022-03-15</td>
        <td th:text="${emp.class.simpleName}">Cajero</td>
    </tr>
    <tr th:if="${#lists.isEmpty(empleados)}">
        <td colspan="6" class="text-center text-muted">No se encontraron empleados activos con los criterios ingresados.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
