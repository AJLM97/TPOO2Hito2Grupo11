<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="page-header d-flex justify-content-between align-items-center">
        <h2>Pedidos</h2>
        <form th:action="@{/empleado/pedidos/abrir}" method="post">
            <button type="submit" class="btn btn-primary">Nuevo Pedido</button>
        </form>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Estado</th>
                        <th>Total</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="pedido : ${pedidos}">
                        <td th:text="${pedido.id}"></td>
                        <td th:text="${#temporals.format(pedido.fechaTransaccion, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <span class="badge badge-secondary" th:if="${pedido.cerrado}">Cerrado</span>
                            <span class="badge badge-warning" th:unless="${pedido.cerrado}">Abierto</span>
                        </td>
                        <td th:text="${#numbers.formatDecimal(pedido.total, 1, 2)}"></td>
                        <td class="action-buttons">
                            <a th:if="${!pedido.cerrado}" th:href="@{/empleado/pedidos/{id}(id=${pedido.id})}" class="btn btn-sm btn-outline-primary">Continuar</a>
                            <a th:if="${pedido.cerrado}" th:href="@{/empleado/pedidos/{id}(id=${pedido.id})}" class="btn btn-sm btn-outline-secondary">Ver detalle</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${pedidos == null or pedidos.isEmpty()}" class="text-center text-muted py-4">
                No hay pedidos registrados.
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
