<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="page-header d-flex justify-content-between align-items-center">
        <h2>Pedidos"</h2>
        <a th:href="@{/empleado/pedidos/nuevo}" class="btn btn-primary">Agregar Pedido</a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fecha Transaccion</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="pedido : ${pedidos}">
                        <td th:text="${pedido.id}"></td>
                        <td th:text="${pedido.fechaTransaccion}"></td>
                        <td th:text="${pedido.cerrado} ? 'Cerrado' : 'Activo'"></td>
                        <td class="action-buttons"/>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${pedidos == null or pedidos.isEmpty()}" class="text-center text-muted py-4">
                No hay pedidos registrads.
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
