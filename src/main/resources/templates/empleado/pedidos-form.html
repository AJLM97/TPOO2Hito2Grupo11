<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="page-header d-flex justify-content-between align-items-center">
        <div>
            <h2 th:text="|Pedido #${pedido.id}|">Pedido</h2>
            <p class="text-muted mb-0">
                <span th:text="${#temporals.format(pedido.fechaTransaccion, 'dd/MM/yyyy HH:mm')}"></span>
                <span class="badge badge-secondary ml-2" th:if="${pedido.cerrado}">Cerrado</span>
                <span class="badge badge-warning ml-2" th:unless="${pedido.cerrado}">Abierto</span>
            </p>
        </div>
        <a th:href="@{/empleado/pedidos}" class="btn btn-outline-secondary">Volver a pedidos</a>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

    <div class="card mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead>
                    <tr>
                        <th>Plato</th>
                        <th>Precio</th>
                        <th>Cantidad</th>
                        <th>Subtotal</th>
                        <th th:unless="${pedido.cerrado}">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${items}">
                        <td th:text="${item.plato.nombre}"></td>
                        <td th:text="${#numbers.formatDecimal(item.plato.precioVenta, 1, 2)}"></td>
                        <td>
                            <form th:unless="${pedido.cerrado}"
                                  th:action="@{/empleado/pedidos/{id}/items/{idItem}/cantidad(id=${pedido.id}, idItem=${item.idItemPedido})}"
                                  method="post" class="form-inline">
                                <input type="number" name="cantidad" th:value="${item.cantidad}" min="1" max="99"
                                       class="form-control form-control-sm" style="width: 80px" required/>
                                <button type="submit" class="btn btn-sm btn-outline-primary ml-2">Actualizar</button>
                            </form>
                            <span th:if="${pedido.cerrado}" th:text="${item.cantidad}"></span>
                        </td>
                        <td th:text="${#numbers.formatDecimal(item.plato.precioVenta * item.cantidad, 1, 2)}"></td>
                        <td class="action-buttons" th:unless="${pedido.cerrado}">
                            <form th:action="@{/empleado/pedidos/{id}/items/{idItem}/quitar(id=${pedido.id}, idItem=${item.idItemPedido})}"
                                  method="post" class="d-inline" onsubmit="return confirm('¿Quitar el plato del pedido?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Quitar</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr>
                        <th colspan="3" class="text-right">Total</th>
                        <th th:text="${#numbers.formatDecimal(pedido.total, 1, 2)}"></th>
                        <th th:unless="${pedido.cerrado}"></th>
                    </tr>
                    </tfoot>
                </table>
            </div>
            <div th:if="${items == null or items.isEmpty()}" class="text-center text-muted py-4">
                El pedido todavía no tiene platos.
            </div>
        </div>
    </div>

    <div class="card form-card mb-4" th:unless="${pedido.cerrado}">
        <div class="card-body">
            <h5>Agregar plato</h5>
            <form th:action="@{/empleado/pedidos/{id}/items(id=${pedido.id})}" th:object="${itemPedido}" method="post">
                <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                    <ul class="mb-0">
                        <li th:each="error : ${#fields.errors('*')}" th:text="${error}"></li>
                    </ul>
                </div>
                <div class="mb-3">
                    <label for="idPlato" class="col-form-label">Plato</label>
                    <select id="idPlato" th:field="*{idPlato}" class="form-control" required>
                        <option value="">Seleccione un plato</option>
                        <option th:each="plato : ${platos}" th:value="${plato.id}"
                                th:text="|${plato.nombre} (${#numbers.formatDecimal(plato.precioVenta, 1, 2)})|"></option>
                    </select>
                    <small class="text-muted" th:if="${platos == null or platos.isEmpty()}">Esta unidad no tiene platos cargados.</small>
                </div>
                <div class="mb-3">
                    <label for="cantidad" class="col-form-label">Cantidad</label>
                    <input type="number" id="cantidad" th:field="*{cantidad}" min="1" max="99" class="form-control" required/>
                </div>
                <button type="submit" class="btn btn-success">Agregar</button>
            </form>
        </div>
    </div>

    <div class="d-flex" th:unless="${pedido.cerrado}">
        <form th:action="@{/empleado/pedidos/{id}/cerrar(id=${pedido.id})}" method="post" class="mr-2"
              onsubmit="return confirm('¿Cerrar el pedido? Después no podrá modificarse')">
            <button type="submit" class="btn btn-primary">Cerrar pedido</button>
        </form>
        <form th:action="@{/empleado/pedidos/{id}/cancelar(id=${pedido.id})}" method="post"
              onsubmit="return confirm('¿Cancelar el pedido? Se eliminará con todos sus platos')">
            <button type="submit" class="btn btn-outline-danger">Cancelar pedido</button>
        </form>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
