<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Alta de Empleado - Epicentro Gourmet</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
    <script>
        function alternarCampos() {
            var tipo = document.getElementById("tipoEmpleado").value;
            if (tipo === "CAJERO") {
                document.getElementById("seccionCajero").style.display = "block";
                document.getElementById("seccionCocinero").style.display = "none";
                document.getElementById("formAlta").action = "/empleados/alta/cajero";
            } else if (tipo === "COCINERO") {
                document.getElementById("seccionCajero").style.display = "none";
                document.getElementById("seccionCocinero").style.display = "block";
                document.getElementById("formAlta").action = "/empleados/alta/cocinero";
            }
        }
    </script>
</head>
<body class="container mt-4" style="max-width: 600px;">
<h2>Registrar Nuevo Empleado</h2>
<p class="text-muted">Alta de Empleado - Unidad ID [[${idUnidadActual}]]</p>
<hr>

<form id="formAlta" method="POST" action="/empleados/alta/cajero">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <input type="hidden" name="idUnidad" th:value="${idUnidadActual}"/>

    <div class="mb-3">
        <label class="form-label font-weight-bold">Tipo de Puesto:</label>
        <select id="tipoEmpleado" class="form-select" onchange="alternarCampos()">
            <option value="CAJERO">Cajero (Operaciones de Caja)</option>
            <option value="COCINERO">Cocinero (Gastronomía / Cocina)</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">DNI:</label>
        <input type="number" name="dni" class="form-control" required/>
    </div>
    <div class="row">
        <div class="col mb-3">
            <label class="form-label">Nombre:</label>
            <input type="text" name="nombre" class="form-control" required/>
        </div>
        <div class="col mb-3">
            <label class="form-label">Apellido:</label>
            <input type="text" name="apellido" class="form-control" required/>
        </div>
    </div>
    <div class="row">
        <div class="col mb-3">
            <label class="form-label">Fecha de Nacimiento:</label>
            <input type="date" name="fechaNacimiento" class="form-control" required/>
        </div>
        <div class="col mb-3">
            <label class="form-label">Fecha de Ingreso:</label>
            <input type="date" name="fechaIngreso" class="form-control" required/>
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Sueldo Base ($):</label>
        <input type="number" step="0.01" name="sueldoBase" class="form-control" required/>
    </div>

    <div class="mb-3 alert alert-info p-2 rounded bg-light border">
        <label class="form-label text-primary font-weight-bold">Correo Electrónico Personal:</label>
        <input type="email" name="emailPersonal" class="form-control" placeholder="ejemplo@gmail.com" required/>
        <small class="form-text text-muted">A esta casilla real se le despacharán las credenciales corporativas
            autogeneradas.</small>
    </div>

    <div id="seccionCajero" class="p-3 mb-3 bg-light border rounded">
        <h5>Especificaciones del Cajero</h5>
        <div class="mb-3">
            <label class="form-label">Turno de Trabajo:</label>
            <select name="turnoTrabajo" class="form-select">
                <option value="MANANA">Mañana</option>
                <option value="TARDE">Tarde</option>
                <option value="NOCHE">Noche</option>
            </select>
        </div>
    </div>

    <div id="seccionCocinero" class="p-3 mb-3 bg-light border rounded" style="display: none;">
        <h5>Especificaciones del Cocinero</h5>
        <div class="mb-3">
            <label class="form-label">Categoría Especializada (Enum):</label>
            <select name="especialidad" class="form-select">
                <option value="COCINERO">Cocinero General</option>
                <option value="COCINERO_AYUDANTE">Cocinero Ayudante</option>
                <option value="LAVAPLATOS">Lavaplatos</option>
            </select>
        </div>
        <div class="row">
            <div class="col mb-3">
                <label class="form-label">Categoría Numérica:</label>
                <input type="number" name="categoria" class="form-control" value="1"/>
            </div>
            <div class="col mb-3">
                <label class="form-label">Porcentaje Comercial (%):</label>
                <input type="number" name="porcentaje" class="form-control" value="0"/>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between mb-4">
        <a th:href="@{/empleados/lista(idUnidad=${idUnidadActual})}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-success">Confirmar y Enviar Mail</button>
    </div>
</form>
</body>
</html>
