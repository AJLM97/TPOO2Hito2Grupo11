<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head th:fragment="head">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Epicentro Gourmet</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top" th:fragment="navbar">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Epicentro Gourmet</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item" sec:authorize="hasAuthority('EMPLEADO')">
                    <a class="nav-link" th:href="@{/empleado/pedidos}">Pedidos</a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('RESPONSABLE')">
                    <a class="nav-link" th:href="@{/responsable/empleados}">Empleados</a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('RESPONSABLE')">
                    <a class="nav-link" th:href="@{/responsable/liquidacion}">Liquidación</a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('RESPONSABLE')">
                    <a class="nav-link" th:href="@{/responsable/platos}">Platos</a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('RESPONSABLE')">
                    <a class="nav-link" th:href="@{/responsable/canon}">Canon</a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('ADMINISTRADOR')">
                    <a class="nav-link" th:href="@{/admin/festivales}">Festivales</a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('RESPONSABLE')">
                    <a class="nav-link" th:href="@{/responsable/reportes/recaudacion}">Recaudación</a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('RESPONSABLE')">
                    <a class="nav-link" th:href="@{/responsable/reportes/rentabilidad}">Rentabilidad</a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('RESPONSABLE')">
                    <a class="nav-link" th:href="@{/responsable/reportes/punto-equilibrio}">Equilibrio</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-toggle="dropdown">
                        <span th:text="${username != null ? username : 'Usuario'}">Usuario</span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-right">
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="dropdown-item">Cerrar sesion</button>
                        </form>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Footer -->
<footer class="text-white py-4" th:fragment="footer">
    <div class="container text-center">
        <p class="mb-0">&copy; 2026 UNLA - Orientación a Objetos 2</p>
    </div>
</footer>

<!-- Scripts -->
<div th:fragment="scripts">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</div>

</body>
</html>
